<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fixed Segment Breathing Timer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #1e1e1e;
      font-family: 'Open Sans', Arial, sans-serif;
      color: #e0e0e0;
    }

    .timer-container {
      text-align: center;
    }

    .phase {
      font-size: 2rem;
      margin-bottom: 10px;
      font-weight: 600;
      font-family: 'Playfair Display', serif;
    }

    .circle {
      position: relative;
      width: 200px;
      height: 200px;
      margin: 0 auto 10px;
      border-radius: 50%;
      background-color: transparent;
      border: 10px solid #e0e0e0;
      transform: scale(0.8);
      transition: transform 1s ease-in-out;
      box-shadow: 0 4px 10px rgba(255, 255, 255, 0.1);
    }

    .circle.inhale {
      transform: scale(1.12);
    }

    .circle.exhale {
      transform: scale(0.8);
    }

    .circle span {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2rem;
      font-weight: 600;
      color: #e0e0e0;
    }

    .controls button {
      padding: 10px 20px;
      margin: 0 10px;
      font-size: 1rem;
      font-family: 'Open Sans', Arial, sans-serif;
      font-weight: 600;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .start-button {
      background-color: #2ecc71;
      color: #1e1e1e;
    }

    .start-button:hover {
      background-color: #27ae60;
    }

    .pause-button {
      background-color: #34495e;
      color: #ffffff;
    }

    .pause-button:hover {
      background-color: #2c3e50;
    }

    .reset-button {
      background-color: #8e44ad;
      color: #ffffff;
    }

    .reset-button:hover {
      background-color: #732d91;
    }

    .total-duration {
      font-size: 1.25rem;
      margin-bottom: 5px;
      color: #e0e0e0;
    }

    .time-left-label {
      font-size: 1.25rem;
      margin-bottom: 10px;
      color: #e0e0e0;
    }

    .segment-info {
      font-size: 1rem;
      margin-bottom: 20px;
      color: #b0b0b0;
    }
  </style>
</head>
<body>
  <div class="timer-container">
    <div class="phase" id="phase-display">Get Ready</div>
    <div class="circle" id="circle">
      <span id="circle-timer"></span>
    </div>
    <div class="time-left-label">Time Left:</div>
    <div class="total-duration" id="total-duration-display">5:00</div>
    <div class="segment-info" id="segment-info">Phase 1: Inhale for 2, Exhale for 3</div>
    <div class="controls">
      <button class="start-button" id="start-button">Start</button>
      <button class="pause-button" id="pause-button" style="display: none;">Pause</button>
      <button class="reset-button" id="reset-button" style="display: none;">Reset</button>
    </div>
  </div>

  <script>
    const segmentDurations = [
      { inhale: 2, exhale: 3, duration: 60, label: 'Phase 1: Inhale for 2, Exhale for 3' },
      { inhale: 4, exhale: 5, duration: 60, label: 'Phase 2: Inhale for 4, Exhale for 5' },
      { inhale: 4, exhale: 6, duration: 180, label: 'Phase 3: Inhale for 4, Exhale for 6' },
    ];

    const totalSessionTime = 300.0; // 5 minutes in seconds
    let remainingSessionTime = totalSessionTime;
    let currentSegmentIndex = 0;
    let phaseIndex = -1;
    let timeLeft = 0;
    let timerInterval;
    let isRunning = false;

    const phaseDisplay = document.getElementById('phase-display');
    const circle = document.getElementById('circle');
    const circleTimer = document.getElementById('circle-timer');
    const totalDurationDisplay = document.getElementById('total-duration-display');
    const segmentInfo = document.getElementById('segment-info');
    const startButton = document.getElementById('start-button');
    const pauseButton = document.getElementById('pause-button');
    const resetButton = document.getElementById('reset-button');

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${String(secs).padStart(2, '0')}`;
    }

    function formatPhaseTime(seconds) {
      const secs = Math.floor(seconds % 60);
      const tenths = Math.floor((seconds % 1) * 10);
      return `${secs}.${tenths}`;
    }

    function updateCircleTransitionDuration(duration) {
      circle.style.transition = `transform ${duration}s ease-in-out`;
    }

    function updateDisplay() {
      if (phaseIndex === -1) {
        phaseDisplay.textContent = 'Get Ready';
        circle.className = 'circle';
        circleTimer.textContent = '';
        totalDurationDisplay.textContent = formatTime(remainingSessionTime);
        segmentInfo.textContent = segmentDurations[0].label;
      } else {
        const segment = segmentDurations[currentSegmentIndex];
        const currentPhase = phaseIndex % 2 === 0 ? 'Inhale' : 'Exhale';
        const currentDuration = phaseIndex % 2 === 0 ? segment.inhale : segment.exhale;
        phaseDisplay.textContent = currentPhase;
        circle.className = `circle ${currentPhase.toLowerCase()}`;
        circleTimer.textContent = formatPhaseTime(timeLeft);
        totalDurationDisplay.textContent = formatTime(remainingSessionTime);
        segmentInfo.textContent = segment.label;
        updateCircleTransitionDuration(currentDuration);
      }
    }

    function playSound(phase, duration) {
      const sounds = {
        inhale: 'https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/juLIYuEYre10CvC03A1h/pub/J8mip7lBT6vgAWHXPxTQ.mp3',
        exhale: 'https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/juLIYuEYre10CvC03A1h/pub/uJ4wEJfrddhk0AfgjR3x.mp3'
      };
      const audio = new Audio(sounds[phase]);
      audio.play();
      setTimeout(() => audio.pause(), duration * 1000);
    }

    function nextPhase() {
      const segment = segmentDurations[currentSegmentIndex];
      phaseIndex = (phaseIndex + 1) % 2; // Alternate between inhale and exhale

      if (phaseIndex === 0) {
        const elapsedTime = totalSessionTime - remainingSessionTime;
        if (elapsedTime >= segment.duration) {
          currentSegmentIndex = Math.min(currentSegmentIndex + 1, segmentDurations.length - 1);
        }
      }

      const currentPhase = phaseIndex === 0 ? 'inhale' : 'exhale';
      timeLeft = phaseIndex === 0 ? segmentDurations[currentSegmentIndex].inhale : segmentDurations[currentSegmentIndex].exhale;
      playSound(currentPhase, timeLeft);
      updateDisplay();
    }

    function startTimer() {
      if (isRunning) return;

      isRunning = true;
      startButton.style.display = 'none';
      pauseButton.style.display = 'inline-block';
      resetButton.style.display = 'inline-block';

      if (phaseIndex === -1) {
        phaseIndex = 0;
        timeLeft = segmentDurations[0].inhale;
        playSound('inhale', timeLeft);
        updateDisplay();
        startBreathingTimer();
      } else {
        startBreathingTimer();
      }
    }

    function startBreathingTimer() {
      timerInterval = setInterval(() => {
        timeLeft -= 0.1;
        remainingSessionTime -= 0.1;

        if (remainingSessionTime <= 0) {
          clearInterval(timerInterval);
          isRunning = false;
          phaseDisplay.textContent = 'Session Complete';
          startButton.style.display = 'inline-block';
          pauseButton.style.display = 'none';
          resetButton.style.display = 'none';
          return;
        }

        if (timeLeft <= 0) {
          nextPhase();
        }

        updateDisplay();
      }, 100);
    }

    function pauseTimer() {
      if (!isRunning) return;

      isRunning = false;
      clearInterval(timerInterval);
      pauseButton.style.display = 'none';
      startButton.textContent = 'Resume';
      startButton.style.display = 'inline-block';
    }

    function resetTimer() {
      clearInterval(timerInterval);
      isRunning = false;
      currentSegmentIndex = 0;
      phaseIndex = -1;
      timeLeft = 0;
      remainingSessionTime = totalSessionTime;
      updateDisplay();
      startButton.textContent = 'Start';
      startButton.style.display = 'inline-block';
      pauseButton.style.display = 'none';
      resetButton.style.display = 'none';
    }

    startButton.addEventListener('click', startTimer);
    pauseButton.addEventListener('click', pauseTimer);
    resetButton.addEventListener('click', resetTimer);

    updateDisplay();
  </script>
</body>
</html>
