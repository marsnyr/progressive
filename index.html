<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Customizable Breathing Timer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #1e1e1e;
      font-family: 'Open Sans', Arial, sans-serif;
      color: #e0e0e0;
    }

    .timer-container {
      text-align: center;
    }

    .phase {
      font-size: 2rem;
      margin-bottom: 10px;
      font-weight: 600;
      font-family: 'Playfair Display', serif;
    }

    .circle {
      position: relative;
      width: 200px;
      height: 200px;
      margin: 0 auto 10px;
      border-radius: 50%;
      background-color: transparent;
      border: 10px solid #e0e0e0;
      transform: scale(0.8);
      transition: transform 1s ease-in-out;
      box-shadow: 0 4px 10px rgba(255, 255, 255, 0.1);
    }

    .circle.inhale {
      transform: scale(1.12);
    }

    .circle.hold1 {
      transform: scale(1.12);
    }

    .circle.exhale {
      transform: scale(0.8);
    }

    .circle.hold2 {
      transform: scale(0.8);
    }

    .circle span {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2rem;
      font-weight: 600;
      color: #e0e0e0;
    }

    .controls button {
      padding: 10px 20px;
      margin: 0 10px;
      font-size: 1rem;
      font-family: 'Open Sans', Arial, sans-serif;
      font-weight: 600;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .start-button {
      background-color: #2ecc71;
      color: #1e1e1e;
    }

    .start-button:hover {
      background-color: #27ae60;
    }

    .pause-button {
      background-color: #34495e;
      color: #ffffff;
    }

    .pause-button:hover {
      background-color: #2c3e50;
    }

    .reset-button {
      background-color: #8e44ad;
      color: #ffffff;
    }

    .reset-button:hover {
      background-color: #732d91;
    }

    .total-duration {
      font-size: 1.25rem;
      margin-bottom: 5px;
      color: #e0e0e0;
    }

    .time-left-label {
      font-size: 1.25rem;
      margin-bottom: 10px;
      color: #e0e0e0;
    }

    .custom-inputs {
      margin-bottom: 20px;
      color: #e0e0e0;
    }

    .custom-inputs label {
      display: block;
      margin-bottom: 5px;
    }

    .custom-inputs input {
      width: 100px;
      margin-bottom: 10px;
      padding: 5px;
      border: 1px solid #34495e;
      border-radius: 5px;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <div class="timer-container">
    <div class="custom-inputs">
      <label for="inhale-duration">Inhale Duration (s):</label>
      <input type="number" id="inhale-duration" step="0.1" min="0.1" value="4">

      <label for="hold1-duration">First Hold Duration (s):</label>
      <input type="number" id="hold1-duration" step="0.1" min="0.1" value="0">

      <label for="exhale-duration">Exhale Duration (s):</label>
      <input type="number" id="exhale-duration" step="0.1" min="0.1" value="4">

      <label for="hold2-duration">Second Hold Duration (s):</label>
      <input type="number" id="hold2-duration" step="0.1" min="0.1" value="0">
    </div>
    <div class="phase" id="phase-display">Get Ready</div>
    <div class="circle" id="circle">
      <span id="circle-timer"></span>
    </div>
    <div class="total-duration" id="total-duration-display">Total Time: 0.0</div>
    <div class="controls">
      <button class="start-button" id="start-button">Start</button>
      <button class="pause-button" id="pause-button" style="display: none;">Pause</button>
      <button class="reset-button" id="reset-button" style="display: none;">Reset</button>
    </div>
  </div>

  <script>
    let inhaleDuration = parseFloat(document.getElementById('inhale-duration').value);
    let hold1Duration = parseFloat(document.getElementById('hold1-duration').value);
    let exhaleDuration = parseFloat(document.getElementById('exhale-duration').value);
    let hold2Duration = parseFloat(document.getElementById('hold2-duration').value);

    let phaseIndex = -1;
    let timeLeft = 0;
    let timerInterval;
    let totalTimeElapsed = 0;
    let isRunning = false;
    let currentAudio;

    const phaseDisplay = document.getElementById('phase-display');
    const circle = document.getElementById('circle');
    const circleTimer = document.getElementById('circle-timer');
    const totalDurationDisplay = document.getElementById('total-duration-display');
    const startButton = document.getElementById('start-button');
    const pauseButton = document.getElementById('pause-button');
    const resetButton = document.getElementById('reset-button');

    const phases = [
      { name: 'Inhale', duration: inhaleDuration, class: 'inhale', sound: 'https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/juLIYuEYre10CvC03A1h/pub/J8mip7lBT6vgAWHXPxTQ.mp3' },
      { name: 'First Hold', duration: hold1Duration, class: 'hold1', sound: 'https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/juLIYuEYre10CvC03A1h/pub/zLQqzZ0tp1deFSwzivtb.mp3' },
      { name: 'Exhale', duration: exhaleDuration, class: 'exhale', sound: 'https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/juLIYuEYre10CvC03A1h/pub/uJ4wEJfrddhk0AfgjR3x.mp3' },
      { name: 'Second Hold', duration: hold2Duration, class: 'hold2', sound: 'https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/juLIYuEYre10CvC03A1h/pub/zLQqzZ0tp1deFSwzivtb.mp3' },
    ];

    function updateDurations() {
      inhaleDuration = parseFloat(document.getElementById('inhale-duration').value);
      hold1Duration = parseFloat(document.getElementById('hold1-duration').value);
      exhaleDuration = parseFloat(document.getElementById('exhale-duration').value);
      hold2Duration = parseFloat(document.getElementById('hold2-duration').value);

      phases[0].duration = inhaleDuration;
      phases[1].duration = hold1Duration;
      phases[2].duration = exhaleDuration;
      phases[3].duration = hold2Duration;
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      const tenths = Math.floor((seconds % 1) * 10);
      return `${mins}:${String(secs).padStart(2, '0')}.${tenths}`;
    }

    function playSound(sound) {
      if (sound) {
        if (currentAudio) currentAudio.pause();
        currentAudio = new Audio(sound);
        currentAudio.play();
      }
    }

    function updateDisplay() {
      if (phaseIndex === -1) {
        phaseDisplay.textContent = 'Get Ready';
        circle.className = 'circle';
        circleTimer.textContent = '';
        totalDurationDisplay.textContent = 'Total Time: 0.0';
      } else {
        const currentPhase = phases[phaseIndex];
        phaseDisplay.textContent = currentPhase.name;
        circle.className = `circle ${currentPhase.class}`;
        circleTimer.textContent = formatTime(timeLeft);
        totalDurationDisplay.textContent = `Total Time: ${formatTime(totalTimeElapsed)}`;
      }
    }

    function nextPhase() {
      phaseIndex = (phaseIndex + 1) % phases.length;
      const currentPhase = phases[phaseIndex];
      timeLeft = currentPhase.duration;
      playSound(currentPhase.sound);
      updateDisplay();
    }

    function startTimer() {
      if (isRunning) return;

      updateDurations();
      isRunning = true;
      startButton.style.display = 'none';
      pauseButton.style.display = 'inline-block';
      resetButton.style.display = 'inline-block';

      if (phaseIndex === -1) {
        phaseIndex = 0;
        timeLeft = phases[0].duration;
        playSound(phases[0].sound);
        updateDisplay();
        startBreathingTimer();
      } else {
        startBreathingTimer();
      }
    }

    function startBreathingTimer() {
      timerInterval = setInterval(() => {
        timeLeft -= 0.1;
        totalTimeElapsed += 0.1;

        if (timeLeft <= 0) {
          nextPhase();
        }

        updateDisplay();
      }, 100);
    }

    function pauseTimer() {
      if (!isRunning) return;

      isRunning = false;
      clearInterval(timerInterval);
      if (currentAudio) currentAudio.pause();
      pauseButton.style.display = 'none';
      startButton.textContent = 'Resume';
      startButton.style.display = 'inline-block';
    }

    function resetTimer() {
      clearInterval(timerInterval);
      if (currentAudio) currentAudio.pause();
      isRunning = false;
      phaseIndex = -1;
      timeLeft = 0;
      totalTimeElapsed = 0;
      updateDisplay();
      startButton.textContent = 'Start';
      startButton.style.display = 'inline-block';
      pauseButton.style.display = 'none';
      resetButton.style.display = 'none';
    }

    startButton.addEventListener('click', startTimer);
    pauseButton.addEventListener('click', pauseTimer);
    resetButton.addEventListener('click', resetTimer);

    updateDisplay();
  </script>
</body>
</html>
